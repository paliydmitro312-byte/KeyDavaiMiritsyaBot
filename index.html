<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ключ, прости меня ❤️</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#120d1c;color:#fff}body{display:flex;justify-content:center}#game{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#40204d 0,#1b1227 45%,#0e0a15 100%)}#stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 37px;opacity:.13}#hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.badge{background:#24182fdd;border:1px solid #ffffff22;border-radius:18px;padding:9px 13px;font-weight:700;font-size:14px;backdrop-filter:blur(8px)}#field{position:absolute;inset:0}#player{position:absolute;z-index:4;bottom:35px;left:50%;width:76px;height:76px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;font-size:56px;filter:drop-shadow(0 5px 8px #0008);touch-action:none}.item{position:absolute;z-index:3;width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:37px;background:#ffffff16;border:1px solid #ffffff20;box-shadow:0 7px 18px #0004;user-select:none}.good{background:#ff4f9a22}.bad{background:#55555522}#hint{position:absolute;z-index:6;left:20px;right:20px;bottom:115px;text-align:center;color:#ffffffaa;font-size:13px}#overlay{position:absolute;z-index:20;inset:0;background:#0c0813d9;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);padding:28px 22px;border-radius:28px;background:linear-gradient(145deg,#30203d,#17101f);border:1px solid #ffffff20;box-shadow:0 20px 60px #0009;text-align:center}h1{font-size:30px;margin:0 0 12px}.sub{color:#ffffffb8;line-height:1.45;margin-bottom:22px}button{border:0;border-radius:18px;padding:15px 24px;background:linear-gradient(135deg,#ff4f9a,#a85cff);color:#fff;font-size:17px;font-weight:800;box-shadow:0 8px 22px #ff4f9a44}.small{margin-top:15px;color:#ffffff66;font-size:12px}.pop{position:absolute;z-index:10;pointer-events:none;font-weight:900;font-size:18px;text-shadow:0 3px 10px #000;animation:pop .75s forwards}@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1;transform:translateY(-8px) scale(1.05)}100%{opacity:0;transform:translateY(-65px) scale(1)}}.shake{animation:shake .25s}.flash{animation:flash .25s}@keyframes shake{25%{transform:translateX(calc(-50% - 8px))}50%{transform:translateX(calc(-50% + 8px))}75%{transform:translateX(calc(-50% - 5px))}}@keyframes flash{50%{filter:brightness(2)}}</style></head>
<body><div id="game"><div id="stars"></div><div id="hud"><div class="badge">❤️ Поймано: <span id="score">0</span>/10</div><div class="badge">💔 Жизни: <span id="lives">3</span></div></div><div id="field"></div><div id="player">🔑</div><div id="hint">Веди пальцем по экрану и помоги Ключу поймать комплименты ❤️</div><div id="overlay"><div class="card"><h1>🔑 Ключ, прости меня</h1><div class="sub">Ты сказала, что его шутки несмешные.<br>Теперь придётся доказать обратное 😏<br><br><b>Поймай 10 комплиментов</b> и Ключ тебя простит.</div><button id="start">НАЧАТЬ ИГРУ ❤️</button><div class="small">Но не лови 💣 — это плохие мысли.</div></div></div></div>
<script>
const field=document.getElementById('field'),player=document.getElementById('player'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay');let score=0,lives=3,running=false,items=[],spawnTimer,raf,last=0,px=0;
const good=[['❤️','Ты самый смешной'],['😍','Ну ладно, красавчик'],['☕','Я должна тебе кофе'],['😂','Ладно, эта была смешная'],['💋','Не злись на меня'],['👑','Ключ — легенда'],['🥹','Я больше не буду'],['❤️','Ты мой любимый зануда'],['✨','Абрикосик, прости'],['🤝','Мир?']];
const bad=[['💣','ШУТКА НЕ ЗАШЛА'],['🗑️','УДАЛИТЬ ЭТУ ФРАЗУ'],['😤','Я ВСЁ ЕЩЁ ЗЛА'],['🙄','НУ ОЧЕНЬ СМЕШНО']];
function reset(){score=0;lives=3;items.forEach(x=>x.el.remove());items=[];scoreEl.textContent=score;livesEl.textContent=lives;player.style.left='50%';px=innerWidth/2}
function start(){reset();running=true;overlay.style.display='none';last=performance.now();spawnTimer=setInterval(spawn,620);spawn();raf=requestAnimationFrame(loop)}
function spawn(){if(!running)return;const isGood=Math.random()<.78,arr=isGood?good:bad,data=arr[Math.floor(Math.random()*arr.length)],el=document.createElement('div');el.className='item '+(isGood?'good':'bad');el.textContent=data[0];const x=10+Math.random()*(field.clientWidth-82);el.style.left=x+'px';el.style.top='-70px';field.appendChild(el);items.push({el,x,y:-70,good:isGood,text:data[1],speed:150+Math.random()*90})}
function popup(text,x,y){const p=document.createElement('div');p.className='pop';p.textContent=text;p.style.left=x+'px';p.style.top=y+'px';field.appendChild(p);setTimeout(()=>p.remove(),750)}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.04);last=t;const pr=player.getBoundingClientRect(),fr=field.getBoundingClientRect(),pLeft=pr.left-fr.left,pTop=pr.top-fr.top,pRight=pLeft+pr.width,pBottom=pTop+pr.height;for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=o.speed*dt;o.el.style.top=o.y+'px';const r={l:o.x,t:o.y,r:o.x+62,b:o.y+62};if(r.r>pLeft+8&&r.l<pRight-8&&r.b>pTop+8&&r.t<pBottom-8){popup(o.good?'+'+o.text:'💥 '+o.text,o.x,o.y);if(o.good){score++;scoreEl.textContent=score;player.classList.add('flash');setTimeout(()=>player.classList.remove('flash'),250);if(score>=10){win();return}}else{lives--;livesEl.textContent=lives;player.classList.add('shake');setTimeout(()=>player.classList.remove('shake'),250);if(lives<=0){lose();return}}o.el.remove();items.splice(i,1);continue}if(o.y>field.clientHeight+70){o.el.remove();items.splice(i,1)}}raf=requestAnimationFrame(loop)}
function endCard(title,text,button){clearInterval(spawnTimer);running=false;cancelAnimationFrame(raf);overlay.innerHTML='<div class="card"><h1>'+title+'</h1><div class="sub">'+text+'</div><button id="again">'+button+'</button></div>';overlay.style.display='flex';document.getElementById('again').onclick=start}
function win(){endCard('💖 ПРОЩАЮ','Ключ поймал все 10 комплиментов.<br><br><b>«Ладно, ты меня убедила. Но кофе всё равно с тебя 😏»</b>','ИГРАТЬ ЕЩЁ')}
function lose(){endCard('💣 Ключ обиделся','Ты поймала слишком много плохих мыслей 😭<br><br>Попробуй ещё раз и докажи, что ты умеешь мириться.','ПОПРОБОВАТЬ ЕЩЁ')}
function move(clientX){const rect=field.getBoundingClientRect();px=Math.max(45,Math.min(rect.width-45,clientX-rect.left));player.style.left=px+'px'}field.addEventListener('pointermove',e=>{if(running)move(e.clientX)});field.addEventListener('pointerdown',e=>{if(running){move(e.clientX);field.setPointerCapture(e.pointerId)}});document.getElementById('start').onclick=start;window.addEventListener('resize',()=>{if(running)move(px)});
</script></body></html>
