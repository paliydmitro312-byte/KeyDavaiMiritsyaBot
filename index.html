<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ключ ловит комплименты</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}h1{font-size:24px;margin:4px 0 2px;text-align:center}.sub{opacity:.7;font-size:13px;margin-bottom:8px}.hud{width:min(94vw,520px);display:flex;justify-content:space-between;margin:4px 0 8px;font-weight:700}#arena{position:relative;width:min(94vw,520px);height:min(72vh,620px);min-height:430px;border:2px solid #444;border-radius:22px;background:linear-gradient(180deg,#242424,#101010);overflow:hidden;touch-action:none}#key{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:62px;line-height:1;z-index:3}.card{position:absolute;padding:9px 12px;border-radius:15px;background:#fff;color:#111;font-size:14px;font-weight:800;box-shadow:0 5px 15px #0008;white-space:nowrap;z-index:2}#message{height:48px;text-align:center;padding:8px 0;font-weight:700}button{border:0;border-radius:14px;padding:12px 22px;font-size:16px;font-weight:800;background:#fff;color:#111}.win{font-size:17px;color:#8cffb0}</style></head><body><div class="wrap"><h1>🔑 Ключ ловит комплименты</h1><div class="sub">Поймай все 10. Ключ должен простить тебя.</div><div class="hud"><span>Комплиментов: <b id="score">0/10</b></span><span id="status">😤 ОБИЖЕН</span></div><div id="arena"><div id="key">🔑</div></div><div id="message">Двигай Ключ пальцем или мышкой и лови комплименты 👀</div><button id="start">НАЧАТЬ ОПЕРАЦИЮ 🍑</button></div><script>const compliments=["Твои шутки смешные 😂","У тебя большой MMR 🎮","Пицца с 🍊 — вкусно 🍕🍊","Голубой маник — ТОП 💅🏻","Твоё упрямство — это плюс 🫴🏻","Козерог — не козёл 🫰","Ты крутой IT-ишник 💻","Грубость — это изюминка 😏","Геи — сила 🏳️‍🌈","Красивая борода 🧔🏻"];const arena=document.getElementById('arena'),key=document.getElementById('key'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status'),msg=document.getElementById('message'),start=document.getElementById('start');let score=0,running=false,items=[],last=0,spawnTimer=0;function reset(){items.forEach(x=>x.el.remove());items=[];score=0;running=false;spawnTimer=0;scoreEl.textContent='0/10';statusEl.textContent='😤 ОБИЖЕН';msg.textContent='Двигай Ключ пальцем или мышкой и лови комплименты 👀';msg.className='';key.style.left='50%'}function moveKey(x){const r=arena.getBoundingClientRect();x=Math.max(38,Math.min(r.width-38,x-r.left));key.style.left=x+'px'}arena.addEventListener('pointermove',e=>{if(running)moveKey(e.clientX)});arena.addEventListener('pointerdown',e=>{if(running)moveKey(e.clientX)});function spawn(){if(score>=10)return;const el=document.createElement('div');el.className='card';el.textContent=compliments[Math.floor(Math.random()*compliments.length)];arena.appendChild(el);const x=8+Math.random()*Math.max(10,arena.clientWidth-el.offsetWidth-16);el.style.left=x+'px';el.style.top='-45px';items.push({el,x,y:-45,speed:75+Math.random()*45})}function loop(t){if(!running)return;const dt=Math.min(.035,(t-last)/1000||0);last=t;spawnTimer+=dt;if(spawnTimer>.72){spawn();spawnTimer=0}const kr=key.getBoundingClientRect(),ar=arena.getBoundingClientRect(),kx=kr.left-ar.left+kr.width/2,ky=kr.top-ar.top+kr.height/2;for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=o.speed*dt;o.el.style.top=o.y+'px';const w=o.el.offsetWidth,h=o.el.offsetHeight,cx=o.x+w/2,cy=o.y+h/2;if(Math.abs(cx-kx)<Math.max(48,w/2)&&Math.abs(cy-ky)<48){o.el.remove();items.splice(i,1);score++;scoreEl.textContent=score+'/10';if(score>=10)win()}else if(o.y>arena.clientHeight+30){o.el.remove();items.splice(i,1)}}requestAnimationFrame(loop)}function win(){running=false;statusEl.textContent='❤️ ПРОСТИЛ';msg.innerHTML='🎉 <b>10 КОМПЛИМЕНТОВ!</b> Ключ официально простил тебя.<br>Уровень обиды: 0% · Самолюбия: 100%';msg.className='win';start.textContent='ИГРАТЬ ЕЩЁ 🍑'}start.onclick=()=>{reset();running=true;start.textContent='ЛОВИ, КЛЮЧ 😈';last=performance.now();requestAnimationFrame(loop)};reset();</script></body></html>
